{% set version = "1.09" %}

package:
  name: libzio
  version: "{{ version }}"

source:
  # SourceForge no longer hosts 1.09; this immutable openSUSE revision has the identical archive.
  url: https://api.opensuse.org/public/source/openSUSE:Factory/libzio/libzio-{{ version }}.tar.bz2?rev=f8663e6cbbe8f008cf3284eb1a15cbd6
  fn: libzio-{{ version }}.tar.bz2
  sha256: 588e0eda6c4bb0813d7383d6a69952f1de5796e580852812c1b3e331036e0157
  patches:
    - fix-makefile.diff

build:
  number: 3
  skip: true  # [not linux]
  run_exports:
    - {{ pin_subpackage('libzio', max_pin='x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
    - xz-tools
  host:
    - zlib
    - zstd
    - bzip2
    - liblzma-devel

test:
  commands:
    - test -f ${PREFIX}/lib/libzio.so.{{ version }}
    - test -f ${PREFIX}/include/zio.h

about:
  home: https://sourceforge.net/projects/libzio/
  summary: 'File stream access for gzip/bzip2/zstd/lzma files'
  license: GPL-2.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
    - isuruf
    - timkpaine
